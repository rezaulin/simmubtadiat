<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ganti Sandi - SIM Mubtadiat</title>
  <link rel="stylesheet" href="./style.css">
  
  <!-- Custom background gradient for login -->
  <style>
    .bg-mesh {
      background-color: var(--color-light-bg);
      background-image: 
        radial-gradient(at 40% 20%, hsla(167, 85%, 39%, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(224, 73%, 51%, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(43, 96%, 56%, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
    }
    
    .dark .bg-mesh {
      background-color: var(--color-dark-bg);
      background-image: 
        radial-gradient(at 40% 20%, hsla(167, 85%, 39%, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(224, 73%, 51%, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(43, 96%, 56%, 0.2) 0px, transparent 50%);
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E7C86">
  <link rel="apple-touch-icon" href="/apple-touch-icon-v6.png">
  <script type="module" src="/src/js/csrf.js"></script>
  <script type="module" src="/src/js/xss.js"></script>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">

  <!-- Toggle Dark Mode Button -->
  <button id="theme-toggle" class="tap-target absolute top-4 right-4 p-2 rounded-full glass hover:scale-105 transition-transform" aria-label="Ganti tema">
    <svg id="theme-icon-dark" class="w-6 h-6 hidden text-accent-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    <svg id="theme-icon-light" class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
  </button>

  <div class="glass rounded-3xl w-full max-w-md p-8 md:p-10 flex flex-col gap-6 relative overflow-hidden">
    
    <!-- Decorative element -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 dark:bg-accent-emerald/20 rounded-full blur-2xl"></div>
    
    <div class="text-center z-10">
      <h1 class="text-3xl font-bold mb-2 text-gradient">Ganti Sandi</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Anda diwajibkan mengganti kata sandi awal</p>
    </div>

    <form id="change-password-form" class="flex flex-col gap-5 z-10">
      <div class="flex flex-col gap-1">
        <label for="old_password" class="text-sm font-semibold ml-1">Sandi Saat Ini (NIK)</label>
        <div class="relative">
          <input type="password" id="old_password" name="old_password" placeholder="••••••••" required
            class="glass-input px-4 py-3 pr-10 rounded-xl w-full text-sm">
          <button type="button" onclick="togglePassword('old_password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg class="w-5 h-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
          </button>
        </div>
      </div>
      
      <div class="flex flex-col gap-1">
        <label for="new_password" class="text-sm font-semibold ml-1">Sandi Baru</label>
        <div class="relative">
          <input type="password" id="new_password" name="new_password" placeholder="Minimal 6 karakter" required
            class="glass-input px-4 py-3 pr-10 rounded-xl w-full text-sm">
          <button type="button" onclick="togglePassword('new_password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg class="w-5 h-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="confirm_password" class="text-sm font-semibold ml-1">Konfirmasi Sandi Baru</label>
        <div class="relative">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi sandi baru" required
            class="glass-input px-4 py-3 pr-10 rounded-xl w-full text-sm">
          <button type="button" onclick="togglePassword('confirm_password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg class="w-5 h-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
          </button>
        </div>
      </div>

      <!-- Error message container -->
      <div id="error-msg" class="hidden text-sm text-red-500 font-medium text-center bg-red-100 dark:bg-red-900/30 p-2 rounded-lg"></div>

      <button type="submit" class="mt-2 bg-primary hover:bg-primary-hover dark:bg-accent-emerald dark:hover:bg-emerald-600 text-white font-medium py-3 rounded-xl transition-all shadow-lg hover:shadow-xl active:scale-95">
        Simpan Sandi Baru
      </button>
    </form>
    
    <div class="text-center z-10 mt-2">
      <button onclick="window.location.href='/login.html'" class="text-xs text-primary hover:underline font-medium">Batal & Kembali ke Login</button>
    </div>
  </div>

  <script type="module">
    // Theme toggler
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-icon-dark');
    const lightIcon = document.getElementById('theme-icon-light');
    
    // Password visibility toggle
    window.togglePassword = function(inputId, btn) {
      const input = document.getElementById(inputId);
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        input.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      }
    };

    // Check local storage or system preference
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark');
      darkIcon.classList.remove('hidden');
      lightIcon.classList.add('hidden');
    } else {
      document.documentElement.classList.remove('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        localStorage.theme = 'dark';
        darkIcon.classList.remove('hidden');
        lightIcon.classList.add('hidden');
      } else {
        localStorage.theme = 'light';
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
    });

    // Change Password Form logic
    const form = document.getElementById('change-password-form');
    const errorMsg = document.getElementById('error-msg');
    const btn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const old_password = form.old_password.value;
      const new_password = form.new_password.value;
      const confirm_password = form.confirm_password.value;
      
      if (new_password !== confirm_password) {
        errorMsg.textContent = 'Sandi baru dan konfirmasi tidak cocok';
        errorMsg.classList.remove('hidden');
        return;
      }

      if (new_password.length < 6) {
        errorMsg.textContent = 'Sandi baru minimal 6 karakter';
        errorMsg.classList.remove('hidden');
        return;
      }

      // Reset error
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';
      btn.textContent = 'Menyimpan...';
      btn.disabled = true;
      btn.classList.add('opacity-70');

      try {
        const response = await fetch('/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ old_password, new_password })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'Gagal mengubah sandi');
        }

        // Success
        btn.textContent = 'Berhasil!';
        btn.classList.add('bg-accent-emerald');
        
        setTimeout(() => {
          window.location.href = '/'; // Go to dashboard
        }, 1000);
        
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        btn.textContent = 'Simpan Sandi Baru';
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
